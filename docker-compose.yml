version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clearancerag-postgres
    environment:
      POSTGRES_USER: clearancerag
      POSTGRES_PASSWORD: clearancerag
      POSTGRES_DB: clearancerag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearancerag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clearancerag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
